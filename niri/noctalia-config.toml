[accessibility]
high_contrast = false
ui_scale = 1.0

[audio]
enable_overdrive = false
enable_sounds = false
notification_sound = ""
sound_volume = 0.5
volume_change_sound = ""

[backdrop]
blur_intensity = 0.0
enabled = true
tint_intensity = 0.0

[bar.main]
auto_hide = false
background_opacity = 0.0
capsule = true
capsule_opacity = 0.0
center = [ "clock" ]
concave_edge_corners = false
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "JetBrainsMono Nerd Font"
font_weight = 400
margin_edge = 0
margin_ends = 0
padding = 14
position = "top"
radius = 12
reserve_space = true
scale = 1.0
shadow = false
smart_auto_hide = true
start = [ "launcher", "wallpaper", "workspaces", "cpu", "ram" ]
thickness = 24
widget_spacing = 6

[brightness]
enable_ddcutil = false

[calendar]
enabled = false
refresh_minutes = 15

[control_center.calendar]
event_date_format = "%A %e %B"
event_time_format = "%H:%M"
show_events_card = true
show_week_numbers = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = false
active_opacity = 1.0
active_scale = 1.0
auto_hide = false
background_opacity = 0.0
cross_axis_padding = 8
enabled = true
icon_size = 32
inactive_opacity = 0.84999999999999998
inactive_scale = 0.84999999999999998
item_spacing = 6
launcher_icon = "grid-dots"
launcher_position = "start"
layer = "top"
magnification = true
magnification_scale = 1.45
main_axis_padding = 16
margin_edge = 8
margin_ends = 0
pinned = [ "foot", "btop", "docker", "dev.zed.Zed", "steam", "cliamp" ]
position = "bottom"
radius = 16
radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16
reserve_space = false
shadow = false
show_dots = true
show_instance_count = true
show_running = true
smart_auto_hide = true

[hooks]
colors_changed = []

[idle]
behavior_order = [ "screen-off", "lock" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 400.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[keybinds]
cancel = [ "escape" ]
delete = [ "del" ]
down = [ "down" ]
left = [ "left" ]
right = [ "right" ]
tab_next = [ "tab" ]
tab_previous = [ "shift+iso_left_tab" ]
up = [ "up" ]
validate = [ "return", "kp_enter", "space" ]

[location]
address = ""
auto_locate = false

[lockscreen]
blur_intensity = 0.0
blurred_desktop = false
enabled = true
tint_intensity = 0.29999999999999999

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 718.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 701.0
    cy = 656.0
    output = "winit"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 0.96999999999999997
enable_daemon = true
layer = "top"
offset_x = 20
offset_y = 8
scale = 1.0
show_actions = true
show_app_name = true

[osd]
background_opacity = 0.96999999999999997
offset_x = 20
offset_y = 8
orientation = "horizontal"
position = "top_right"
position_vertical = "top_center"
scale = 1.0

    [osd.kinds]
    bluetooth = true
    brightness = true
    caffeine = true
    dnd = true
    keyboard_layout = true
    lock_keys = false
    nightlight = true
    power_profile = true
    privacy = true
    volume = true
    volume_input = true
    volume_output = true
    wifi = true

[shell]
clipboard_auto_paste = "auto"
clipboard_enabled = true
clipboard_history_max_entries = 100
clipboard_image_action_command = ""
clipboard_keep_from_closed_apps = true
corner_radius_scale = 0.90000000000000002
date_format = "%A, %x"
font_family = "sans-serif"
niri_overview_type_to_launch_enabled = true
offline_mode = false
password_style = "default"
polkit_agent = true
settings_show_advanced = true
shared_gl_context = true
show_location = true
telemetry_enabled = false
time_format = "{:%I:%M %p}"

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.launcher]
    app_grid = false
    auto_paste = "auto"
    categories = true
    compact = false
    fetch_exchange_rates = true
    provider_prefix = "/"
    show_icons = true
    sort_by_usage = true

        [shell.launcher.providers.calculator]
        global = true
        prefix = "calc"

        [shell.launcher.providers.emoji]
        prefix = "emo"

        [shell.launcher.providers.session]
        global = false
        prefix = "session"

        [shell.launcher.providers.wallpaper]
        prefix = "wall"

        [shell.launcher.providers.windows]
        prefix = "win"

    [shell.mpris]
    blacklist = []

    [shell.panel]
    borders = true
    clipboard_placement = "floating"
    clipboard_position = "center"
    control_center_placement = "attached"
    launcher_placement = "floating"
    launcher_position = "center"
    open_near_click_clipboard = false
    open_near_click_control_center = false
    open_near_click_launcher = false
    open_near_click_session = true
    open_near_click_wallpaper = false
    session_placement = "attached"
    shadow = false
    transparency_mode = "glass"
    wallpaper_placement = "attached"

    [shell.privacy]
    cam_filter_regex = ""
    mic_filter_regex = ""
    screen_filter_regex = ""

    [shell.shadow]
    alpha = 0.55000000000000004
    direction = "down"

[system.monitor]
cpu_poll_seconds = 3.0
disk_poll_seconds = 10.0
enabled = true
gpu_poll_seconds = 5.0
memory_poll_seconds = 3.0
network_poll_seconds = 5.0

[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = false
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "foot", "gtk3", "gtk4", "kcolorscheme", "niri", "qt", "starship" ]
    community_ids = [ "opencode", "discord", "vscode", "zed", "steam", "fuzzel", "lazygit" ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user]
        zed = { input_path = "templates/zed/zедактор.json", output_path = "~/.config/zed/themes/noctalia.json", post_hook = "templates/zed/apply.sh" }

[wallpaper]
directory = "~/Pictures/Wallpapers"
directory_dark = ""
directory_light = ""
edge_smoothness = 0.29999999999999999
enabled = false
fill_color = ""
fill_mode = "crop"
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500
transition_on_startup = false

    [wallpaper.automation]
    enabled = false
    interval_seconds = 1800
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "/home/niraletter/Pictures/Wallpapers/matte-black/1-dark-waters.jpg"

    [wallpaper.last]
    path = "/home/niraletter/Pictures/Wallpapers/matte-black/1-dark-waters.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/niraletter/Pictures/Wallpapers/matte-black/1-dark-waters.jpg"

[weather]
effects = true
enabled = false
refresh_minutes = 30
unit = "celsius"

[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "{:%I:%M %p}"

[widget.network]
show_label = false
